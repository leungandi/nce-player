name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run check

      - name: 单元测试
        run: npm test

      - uses: actions/configure-pages@v5
        id: pages

      - name: 构建静态站点
        run: npm run build
        env:
          # 自定义域名生效时 base 为空字符串，未生效时为 /nce-player
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # 音频放在独立资源仓库，用它的自定义域名直连。
          # 不要用这两个：leungandi.github.io/nce-audio 会被 301 到 http://loveyy.net
          # （桌面浏览器按混合内容拦掉）；loveyy.net 的 A 记录还指向 GitHub 旧 IP，
          # HTTPS 证书不匹配。
          VITE_MEDIA_BASE: https://nce-audio.loveyy.net

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
